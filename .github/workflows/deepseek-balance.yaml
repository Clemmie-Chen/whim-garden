# Daily DeepSeek balance check for /api/romanize. A failed run is the alert: GitHub emails you.
# Needs the repo secret DEEPSEEK_API_KEY (Settings → Secrets and variables → Actions).
name: DeepSeek balance

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 Beijing time
  workflow_dispatch:

jobs:
  check:
    if: ${{ github.repository == 'Clemmie-Chen/whim-garden' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if balance is below MIN_CNY
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIN_CNY: "5"
        run: |
          body=$(curl -sf -H "Authorization: Bearer $KEY" https://api.deepseek.com/user/balance) \
            || { echo "::error::查不到 DeepSeek 余额：key 没配或失效"; exit 1; }
          bal=$(echo "$body" | jq -r '.balance_infos[] | select(.currency=="CNY") | .total_balance')
          echo "DeepSeek 余额 ¥${bal:-?}"
          awk -v b="${bal:-0}" -v m="$MIN_CNY" 'BEGIN { exit !(b >= m) }' \
            || { echo "::error::DeepSeek 余额 ¥${bal:-?}，低于 ¥$MIN_CNY，该充值了"; exit 1; }
