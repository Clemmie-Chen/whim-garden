<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clemmie 的房间</title>
<style>
  :root { --bg:#f4efe6; --ink:#3b3127; --muted:#8a7b6a; --card:#fffaf2; --line:#e0d4c2; --accent:#c8743a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1b17; --ink:#efe5d6; --muted:#a8998a; --card:#2b2520; --line:#433a31; --accent:#e39a5f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; }
  .hint { color:var(--muted); font-size:13px; margin:4px 0 10px; }
  a { color:var(--accent); }
  #room { width:100%; height:auto; display:block; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.15); touch-action:manipulation; }
  .hot { cursor:pointer; }
  .hot:hover > *:first-child, .hot:focus-visible > *:first-child { filter:brightness(1.12); }
  .hot:focus-visible { outline:none; }
  .hot:focus-visible > *:first-child { stroke:#ffcf6e; stroke-width:3; }
  .hud { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:10px 0; font-size:13px; color:var(--muted); }
  .bar { display:inline-flex; align-items:center; gap:6px; }
  .bar i { display:inline-block; width:64px; height:7px; border-radius:4px; background:var(--line); overflow:hidden; }
  .bar b { display:block; height:100%; background:var(--accent); transition:width .5s; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); max-width:min(520px, calc(100vw - 32px)); padding:20px 22px; }
  dialog::backdrop { background:rgba(30,20,10,.35); }
  dialog h2 { margin:0 0 4px; font-size:18px; }
  dialog .sub { color:var(--muted); font-size:13px; margin:0 0 10px; }
  dialog ul { padding-left:18px; }
  dialog button.close { float:right; border:0; background:none; font-size:20px; color:var(--muted); cursor:pointer; }
  details { margin-top:12px; color:var(--muted); font-size:13px; }
  details button { margin:4px 6px 0 0; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:3px 10px; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🏠 欢迎来我家玩</h1>
    <a href="/">← 回到花园</a>
  </header>
  <p class="hint">点房间里的东西看看 · 点小猫摸摸它 · 猫碗空了可以帮忙添 · 点毛线球逗猫</p>
  <svg id="room" viewBox="0 0 800 560" role="application" aria-label="从上往下俯视的房间"></svg>
  <div class="hud" id="hud" aria-live="off"></div>
  <details>
    <summary>看不清？这里是房间里所有东西的目录</summary>
    <div id="index"></div>
  </details>
</main>
<dialog id="card"><button class="close" aria-label="关闭">×</button><div id="cardBody"></div></dialog>

<script>
// ============ 想改内容，改这里就好 ============
const CAT = { name: '小猫', color: '#e9a25a', stripe: '#c0763a', belly: '#fff3e0',
  intro: '家里的主子。会自己吃饭、喝水、睡觉、追毛线球，偶尔过来蹭蹭人。' };
const BOOKS = [
  { title: '后现代状况', author: 'Lyotard', color: '#7a8b6f', note: '后现代 = 对元叙事的怀疑。知识在信息社会里如何获得合法性？', href: '/what-i-read/后现代状况｜lyotard' },
  { title: '现代性的哲学话语', author: 'Habermas', color: '#a35d4c', note: '从黑格尔到哈贝马斯，现代性与合理性之间那根线是怎么断掉又被接上的。', href: '/what-i-write/现代性的哲学话语：从黑格尔到哈贝马斯——读《现代性的哲学话语》' },
  { title: 'Clarence Thomas', author: '书评', color: '#4f6b8a', note: '为什么黑人会成为右派保守民族主义者？', href: '/what-i-write/clarence-thomas｜为什么黑人会成为右派保守民族主义者' },
  { title: 'The Human Brain', author: 'MIT 9.13', color: '#d0a24a', note: 'Kanwisher 的认知神经科学课，每周的讲义和读书笔记。', href: '/what-i-learn/the-human-brain-(mit-9.13)/' },
  { title: 'Mahabharata', author: '电视剧', color: '#8b5a8c', note: '267 集，每一集都值得。（本科读的是印地语）' },
];
const THINGS = {
  laptop: { title: '💻 笔记本电脑', sub: '我做过的小东西', html: `<ul>
    <li><a href="/how-i-do/上海言话：给上海话注音">上海言话：给上海话注音</a></li>
    <li><a href="/how-i-do/shanghai-mahjong：给外国朋友的一页上海麻将入门">Shanghai Mahjong：一页上海麻将入门</a></li>
    <li><a href="/how-i-do/home-rentor：把看房决策浓缩进一张图">Home-rentor：找房比房小工具</a></li>
    <li><a href="/how-i-do/how-i-build-this-garden-––-obsidian-quartz-guide">这个花园是怎么搭起来的</a></li></ul>` },
  me: { title: '👩 这是我', sub: 'Clemmentine', html: `<p>AI Agent PM，在创业公司。之前在 Pine AI、Syft AI、Toki AI。</p>
    <p>语言数据科学硕士，本科读印地语。母语中文，所以这里中英混杂。</p>` },
  plant: { title: '🪴 一盆植物', sub: '我的兔子洞们', html: `<ul><li>认知神经科学：大脑、创造力、决策、注意力、记忆、ADHD</li>
    <li>LLM：可解释性、对齐、多 agent 编排</li><li>哲学：伦理学，以及对康德莫名的共鸣</li><li>语言学：语音学与音系学</li></ul>` },
  notebook: { title: '📓 摊开的笔记本', sub: 'What I learn', html: `<p>最近在啃 <a href="/what-i-learn/the-human-brain-(mit-9.13)/">The Human Brain (MIT 9.13)</a>。</p>` },
  mahjong: { title: '🀄 一副麻将', sub: '上海麻将', html: `<p>想学？看这篇 <a href="/how-i-do/shanghai-mahjong：给外国朋友的一页上海麻将入门">给外国朋友的一页上海麻将入门</a>，或者直接玩 <a href="/static/shanghai-mahjong/">在线版</a>。</p>` },
  door: { title: '🚪 门口', sub: '欢迎', html: `<p>这里是我的 Whim Garden，我在这里读书、思考、记笔记、写东西。<a href="/">去花园正门看看</a>。</p>` },
  cat: { title: '🐱 ' + CAT.name, sub: '主子', html: `<p>${CAT.intro}</p>` },
};
// ===========================================

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('room');
const el = (tag, attrs = {}, parent = svg) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
const rand = (a, b) => a + Math.random() * (b - a);
const card = document.getElementById('card'), cardBody = document.getElementById('cardBody');
card.querySelector('.close').onclick = () => card.close();
card.addEventListener('click', e => { if (e.target === card) card.close(); });
function openCard(t) {
  cardBody.innerHTML = `<h2>${t.title}</h2><p class="sub">${t.sub || ''}</p>${t.html || ''}` + (t.href ? `<p><a href="${t.href}">读我的笔记 →</a></p>` : '');
  card.showModal();
}
const indexBox = document.getElementById('index');
function hot(g, label, fn) {
  g.classList.add('hot'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', label);
  g.addEventListener('click', fn);
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  const b = document.createElement('button'); b.textContent = label; b.onclick = fn; indexBox.appendChild(b);
}
const thing = (key, label, draw) => { const g = el('g'); draw(g); hot(g, label, () => openCard(THINGS[key])); return g; };

// ---------- room ----------
const defs = el('defs');
const pat = el('pattern', { id: 'wood', width: 120, height: 24, patternUnits: 'userSpaceOnUse' }, defs);
el('rect', { width: 120, height: 24, fill: '#d9b98c' }, pat);
el('path', { d: 'M0 23.5H120M60 0V24', stroke: '#c9a677', 'stroke-width': 1 }, pat);
el('rect', { width: 800, height: 560, fill: '#efe7da' });           // walls
el('rect', { x: 20, y: 20, width: 760, height: 520, fill: 'url(#wood)' }); // floor
const hour = new Date().getHours(), night = hour < 7 || hour >= 19;
el('rect', { x: 320, y: 6, width: 150, height: 14, fill: night ? '#2c3a5c' : '#bfe3f5', stroke: '#fff', 'stroke-width': 3 }); // window
if (!night) el('path', { d: 'M330 20 L460 20 L500 140 L300 140 Z', fill: '#fff7d6', opacity: .35 });

thing('door', '门口', g => { el('rect', { x: 360, y: 540, width: 80, height: 20, fill: '#9a7550' }, g); el('text', { x: 400, y: 554, 'text-anchor': 'middle', 'font-size': 11, fill: '#fff' }, g).textContent = 'WELCOME'; });

// rug + coffee table
el('ellipse', { cx: 390, cy: 310, rx: 150, ry: 92, fill: '#d98c6c', opacity: .55 });
el('ellipse', { cx: 390, cy: 310, rx: 130, ry: 76, fill: 'none', stroke: '#f4e4d0', 'stroke-width': 3, 'stroke-dasharray': '6 6' });
el('rect', { x: 330, y: 272, width: 120, height: 70, rx: 8, fill: '#8a6240' });
thing('notebook', '摊开的笔记本', g => { el('rect', { x: 340, y: 282, width: 46, height: 32, rx: 2, fill: '#fdfaf2', stroke: '#c9b89c' }, g); el('path', { d: 'M363 282V314M345 290h14M345 296h14M368 290h14M368 296h12', stroke: '#aab', 'stroke-width': 1 }, g); });
thing('mahjong', '一副麻将', g => { el('rect', { x: 396, y: 286, width: 46, height: 40, fill: 'transparent' }, g); for (let i = 0; i < 4; i++) el('rect', { x: 398 + i * 11, y: 300, width: 9, height: 13, rx: 2, fill: '#f6f0e0', stroke: '#2f7a4c', 'stroke-width': 1.5 }, g); });

// sofa
el('rect', { x: 28, y: 220, width: 78, height: 190, rx: 14, fill: '#6f8f9c' });
el('rect', { x: 28, y: 232, width: 24, height: 166, rx: 8, fill: '#5d7b87' });
el('rect', { x: 58, y: 236, width: 42, height: 76, rx: 8, fill: '#7fa0ad' });
el('rect', { x: 58, y: 318, width: 42, height: 76, rx: 8, fill: '#7fa0ad' });

// bookshelf with clickable books
el('rect', { x: 36, y: 24, width: 250, height: 52, fill: '#7b5536' });
el('rect', { x: 42, y: 30, width: 238, height: 40, fill: '#5e3f27' });
let bx = 48;
BOOKS.forEach((b, i) => {
  const w = 18 + (i % 3) * 4;
  const g = el('g');
  el('rect', { x: bx, y: 32, width: w, height: 36, rx: 2, fill: b.color }, g);
  el('rect', { x: bx + 3, y: 36, width: w - 6, height: 3, fill: 'rgba(255,255,255,.45)' }, g);
  hot(g, '书：' + b.title, () => openCard({ title: '📖 ' + b.title, sub: b.author, html: `<p>${b.note}</p>`, href: b.href }));
  bx += w + 3;
});
for (let x = bx; x < 270; x += 14) el('rect', { x, y: 38, width: 11, height: 30, rx: 2, fill: ['#b9a58a', '#9aa597', '#c7b6a1'][x % 3], opacity: .7 }); // filler, not clickable

// desk + laptop
el('rect', { x: 560, y: 26, width: 210, height: 86, rx: 4, fill: '#a9825c' });
thing('laptop', '笔记本电脑', g => { el('rect', { x: 620, y: 40, width: 70, height: 46, rx: 4, fill: '#cfd3d8', stroke: '#8a9099' }, g); el('rect', { x: 628, y: 46, width: 54, height: 30, fill: '#2b3a4a' }, g); el('text', { x: 655, y: 66, 'text-anchor': 'middle', 'font-size': 11, fill: '#8fe3a8', 'font-family': 'monospace' }, g).textContent = '>_'; });
el('circle', { cx: 590, cy: 60, r: 9, fill: '#fff', stroke: '#c8743a', 'stroke-width': 3 }); // mug
el('circle', { cx: 730, cy: 58, r: 22, fill: night ? '#ffe9a8' : '#f2e1b8', opacity: night ? .9 : .5 }); // lamp
el('circle', { cx: 655, cy: 140, r: 20, fill: '#555b66' }); // chair

// bed
el('rect', { x: 590, y: 330, width: 180, height: 200, rx: 10, fill: '#efe9df', stroke: '#cdbfae', 'stroke-width': 2 });
el('rect', { x: 604, y: 340, width: 66, height: 34, rx: 10, fill: '#fff' });
el('rect', { x: 690, y: 340, width: 66, height: 34, rx: 10, fill: '#fff' });
el('rect', { x: 594, y: 392, width: 172, height: 134, rx: 8, fill: '#b9c7a5' });
el('path', { d: 'M594 420H766M594 450H766M594 480H766', stroke: '#a8b794', 'stroke-width': 2 });

thing('plant', '一盆植物', g => { el('circle', { cx: 755, cy: 160, r: 16, fill: '#b5643c' }, g); for (let a = 0; a < 7; a++) el('ellipse', { cx: 755 + Math.cos(a) * 14, cy: 160 + Math.sin(a) * 14, rx: 13, ry: 6, transform: `rotate(${a * 57} ${755 + Math.cos(a) * 14} ${160 + Math.sin(a) * 14})`, fill: '#5d9a5a' }, g); });

// cat stuff
const SPOT = { food: [170, 492], water: [222, 492], catbed: [90, 150], bed: [680, 440] };
el('ellipse', { cx: 90, cy: 150, rx: 38, ry: 32, fill: '#c98f8f' });
el('ellipse', { cx: 90, cy: 150, rx: 28, ry: 23, fill: '#f1d6d0' });
const bowls = {};
[['food', '#e7a33e', '猫粮碗'], ['water', '#6db3e0', '水碗']].forEach(([k, c, label]) => {
  const [x, y] = SPOT[k], g = el('g');
  el('circle', { cx: x, cy: y + 26, r: 17, fill: '#8f6a8f' }, g);
  const fill = el('circle', { cx: x, cy: y + 26, r: 11, fill: c }, g);
  bowls[k] = { level: 100, fill, color: c };
  hot(g, label + '（点一下添满）', () => { bowls[k].level = 100; say(me, k === 'food' ? '添好饭啦' : '换好水啦'); });
});

// ball
const ballG = el('g'); el('circle', { r: 9, fill: '#e2577a' }, ballG); el('path', { d: 'M-8 -3Q0 4 8 -3M-6 4Q0 -2 6 5', stroke: '#fff', fill: 'none', 'stroke-width': 1.5 }, ballG);
const ball = { x: 470, y: 440, vx: 0, vy: 0 };
hot(ballG, '毛线球（点一下扔出去）', () => { const a = rand(0, 6.28); ball.vx = Math.cos(a) * 320; ball.vy = Math.sin(a) * 320; if (cat.state !== 'sleep') { cat.goal = 'play'; cat.plays = 3; cat.state = 'walk'; } });

// ---------- creatures ----------
function bubble(parent) { const t = el('text', { y: -26, 'text-anchor': 'middle', 'font-size': 14, fill: '#3b3127', 'paint-order': 'stroke', stroke: '#fffaf2', 'stroke-width': 4 }, parent); return t; }
function say(who, text, sec = 2.5) { who.bubble.textContent = text; who.sayT = sec; }

// me: top-down person
const meG = el('g');
const meBody = el('g', {}, meG);
el('ellipse', { rx: 18, ry: 11, fill: '#d86f5a' }, meBody);          // shoulders
el('circle', { r: 10, fill: '#2d2420' }, meBody);                      // hair
el('path', { d: 'M4 -6 Q12 0 4 6', fill: '#f2c9a5' }, meBody);       // face peeking
const me = { x: 655, y: 150, ang: -1.57, state: 'act', t: 6, bubble: bubble(meG), sayT: 0, spot: 'desk' };
hot(meG, '我', () => openCard(THINGS.me));
const ME_SPOTS = {
  desk: { p: [655, 140], ang: -1.57, say: '写代码中…' }, sofa: { p: [80, 310], ang: 0, say: '窝在沙发看书📖' },
  shelf: { p: [160, 100], ang: -1.57, say: '找本书…' }, bed: { p: [680, 430], ang: -1.57, say: '躺平一下' },
  table: { p: [390, 365], ang: -1.57, say: '记笔记✏️' }, window: { p: [395, 50], ang: -1.57, say: '看看窗外' },
};

// cat: top-down, facing +x
const catG = el('g'), catBody = el('g', {}, catG);
const tail = el('path', { fill: 'none', stroke: CAT.color, 'stroke-width': 5, 'stroke-linecap': 'round' }, catBody);
const torso = el('ellipse', { rx: 17, ry: 10, fill: CAT.color }, catBody);
const stripes = el('path', { d: 'M-8 -9V9M-2 -10V10M4 -9V9', stroke: CAT.stripe, 'stroke-width': 2.5 }, catBody);
const headG = el('g', { transform: 'translate(16 0)' }, catBody);
el('path', { d: 'M-2 -8 L4 -13 L5 -4Z M-2 8 L4 13 L5 4Z', fill: CAT.stripe }, headG);
el('circle', { r: 8, fill: CAT.color }, headG);
el('circle', { cx: 5, r: 3, fill: CAT.belly }, headG);
const zzz = el('text', { x: 10, y: -14, 'font-size': 12, fill: '#6a6aa0' }, catG);
const cat = { x: 300, y: 440, ang: 0, state: 'idle', t: 1, goal: null, plays: 0, bubble: bubble(catG), sayT: 0,
  needs: { hunger: 70, thirst: 55, energy: 75, fun: 45 } };
hot(catG, '摸摸' + CAT.name, () => {
  if (cat.state === 'sleep') { say(cat, '(睡着了，轻点)'); return; }
  cat.needs.fun = Math.min(100, cat.needs.fun + 15); cat.state = 'act'; cat.goal = 'pet'; cat.t = 2.5; say(cat, '呼噜呼噜 ❤');
});

// ---------- brain ----------
const DECAY = { hunger: .7, thirst: .9, energy: .45, fun: 1.1 }; // per second; 0 = urgent
const NEED_GOAL = { hunger: 'eat', thirst: 'drink', energy: 'sleep', fun: 'play' };
function pickGoal(n) {
  const low = Object.keys(NEED_GOAL).filter(k => n[k] < 35).sort((a, b) => n[a] - n[b]);
  return low.length ? NEED_GOAL[low[0]] : (Math.random() < .25 ? 'visit' : 'wander');
}
console.assert(pickGoal({ hunger: 10, thirst: 20, energy: 90, fun: 90 }) === 'eat' && pickGoal({ hunger: 90, thirst: 90, energy: 5, fun: 30 }) === 'sleep', 'pickGoal');

function goalTarget(g) {
  if (g === 'eat') return SPOT.food; if (g === 'drink') return SPOT.water;
  if (g === 'sleep') return Math.random() < .3 ? SPOT.bed : SPOT.catbed;
  if (g === 'play') return [ball.x, ball.y]; if (g === 'visit') return [me.x + 26, me.y + 18];
  return [rand(60, 740), rand(180, 520)];
}
function decide() {
  cat.goal = pickGoal(cat.needs);
  if (cat.goal === 'play') cat.plays = 2;
  cat.target = goalTarget(cat.goal); cat.state = 'walk';
}
function arrive() {
  const g = cat.goal, n = cat.needs;
  if (g === 'eat' || g === 'drink') {
    const b = bowls[g === 'eat' ? 'food' : 'water'];
    if (b.level < 20) { say(cat, '喵～' + (g === 'eat' ? '没饭了' : '没水了'), 3); cat.state = 'act'; cat.t = 3; return; }
    b.level -= 35; cat.state = 'act'; cat.t = 6; say(cat, g === 'eat' ? '🐟 吧唧吧唧' : '💧 舔舔', 6); return;
  }
  if (g === 'sleep') { cat.state = 'sleep'; cat.t = rand(20, 32); return; }
  if (g === 'play') { // kick the ball and chase again
    n.fun = Math.min(100, n.fun + 25); const a = rand(0, 6.28); ball.vx = Math.cos(a) * 260; ball.vy = Math.sin(a) * 260;
    if (--cat.plays > 0) { say(cat, '扑！', 1); return; } cat.state = 'act'; cat.t = 2; return;
  }
  if (g === 'visit') { say(cat, '蹭蹭～'); n.fun = Math.min(100, n.fun + 10); cat.state = 'act'; cat.t = 3; return; }
  cat.state = 'act'; cat.t = rand(2, 5); // wander: sit a bit
}
function walk(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d < 4) return true;
  o.ang = Math.atan2(dy, dx); const s = Math.min(d, speed * dt); o.x += dx / d * s; o.y += dy / d * s; return false;
}

function update(dt, now) {
  const n = cat.needs;
  for (const k in DECAY) n[k] = Math.max(0, n[k] - DECAY[k] * dt * (cat.state === 'sleep' && k === 'energy' ? 0 : 1));
  if (cat.state === 'walk') {
    if (cat.goal === 'play') cat.target = [ball.x, ball.y];
    if (walk(cat, cat.target[0], cat.target[1], cat.goal === 'play' ? 150 : 55, dt)) arrive();
  } else if (cat.state === 'act' || cat.state === 'sleep') {
    if (cat.goal === 'eat' && cat.sayT > 0) n.hunger = Math.min(100, n.hunger + 18 * dt);
    if (cat.goal === 'drink' && cat.sayT > 0) n.thirst = Math.min(100, n.thirst + 18 * dt);
    if (cat.state === 'sleep') n.energy = Math.min(100, n.energy + 5 * dt);
    if ((cat.t -= dt) <= 0) { cat.state = 'idle'; cat.t = rand(.5, 2); }
  } else if ((cat.t -= dt) <= 0) decide();

  // me: drift between spots
  if (me.state === 'walk') { if (walk(me, ...ME_SPOTS[me.spot].p, 45, dt)) { me.state = 'act'; me.t = rand(10, 18); me.ang = ME_SPOTS[me.spot].ang; say(me, ME_SPOTS[me.spot].say, 4); } }
  else if ((me.t -= dt) <= 0) { const ks = Object.keys(ME_SPOTS).filter(k => k !== me.spot); me.spot = ks[Math.floor(Math.random() * ks.length)]; me.state = 'walk'; }

  // ball physics
  ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.vx *= Math.pow(.25, dt); ball.vy *= Math.pow(.25, dt);
  if (ball.x < 32 || ball.x > 768) { ball.vx *= -1; ball.x = Math.max(32, Math.min(768, ball.x)); }
  if (ball.y < 90 || ball.y > 528) { ball.vy *= -1; ball.y = Math.max(90, Math.min(528, ball.y)); }

  for (const o of [cat, me]) if (o.sayT > 0 && (o.sayT -= dt) <= 0) o.bubble.textContent = '';
  render(now);
}

function render(now) {
  const sleeping = cat.state === 'sleep', walking = cat.state === 'walk';
  catG.setAttribute('transform', `translate(${cat.x.toFixed(1)} ${cat.y.toFixed(1)})`);
  catBody.setAttribute('transform', `rotate(${(cat.ang * 57.3).toFixed(1)})` + (sleeping ? ' scale(.85)' : ''));
  const w = Math.sin(now / (walking ? 120 : 400)) * (sleeping ? 2 : 8);
  tail.setAttribute('d', sleeping ? 'M-14 4 Q-4 18 12 10' : `M-16 0 Q-26 ${w} -34 ${w * 1.6}`);
  torso.setAttribute('rx', sleeping ? 13 : 17); torso.setAttribute('ry', sleeping ? 12 : 10);
  headG.setAttribute('transform', sleeping ? 'translate(9 -6) rotate(-60)' : 'translate(16 0)');
  zzz.textContent = sleeping ? 'z'.repeat(1 + Math.floor(now / 600) % 3) : '';
  meG.setAttribute('transform', `translate(${me.x.toFixed(1)} ${me.y.toFixed(1)})`);
  meBody.setAttribute('transform', `rotate(${(me.ang * 57.3).toFixed(1)})`);
  ballG.setAttribute('transform', `translate(${ball.x.toFixed(1)} ${ball.y.toFixed(1)})`);
  for (const k in bowls) { const b = bowls[k]; b.fill.setAttribute('r', (3 + b.level / 100 * 8).toFixed(1)); b.fill.setAttribute('fill', b.level < 20 ? '#ccc' : b.color); }
}

const hud = document.getElementById('hud');
const LABEL = { hunger: '饱', thirst: '水', energy: '精神', fun: '开心' };
function drawHud() {
  const doing = { sleep: '在睡觉', walk: { eat: '去吃饭', drink: '去喝水', sleep: '去睡觉', play: '在玩球', visit: '去找人', wander: '溜达' }[cat.goal] || '溜达' };
  hud.innerHTML = `<strong>🐱 ${CAT.name}：${doing[cat.state] || '发呆'}</strong>` +
    Object.keys(LABEL).map(k => `<span class="bar">${LABEL[k]}<i><b style="width:${cat.needs[k]}%"></b></i></span>`).join('');
}
setInterval(drawHud, 500); drawHud();

let last = performance.now();
function loop(now) { update(Math.min(.1, (now - last) / 1000), now); last = now; requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
